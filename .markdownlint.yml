# Markdownlint configuration
# See: https://github.com/DavidAnson/markdownlint#rules--aliases

default: true

# Formatting & Whitespace rules relaxed for documentation repository
MD001: false  # Heading levels increment
MD009: false  # Trailing spaces
MD013: false  # Line length
MD022: false  # Headings should be surrounded by blank lines
MD024:
  siblings_only: true  # Allow duplicate headings in different parent sections
MD025: false  # Multiple top-level headings in the same document
MD031: false  # Fenced code blocks surrounded by blank lines
MD032: false  # Lists surrounded by blank lines
MD033: false  # Inline HTML (used in alerts and diagrams)
MD040: false  # Fenced code blocks language specification
MD041: false  # First line must be top-level heading
MD058: false  # Tables surrounded by blank lines
MD060: false  # Table column style
