name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/development/git-workflow.md
          test -f docs/development/development-guide.md
          test -f docs/development/coding-standards.md
          test -f docs/development/environment-strategy.md
          test -f docs/architecture/ADR/README.md

      - name: Check for tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|development|staging|production)$'; then
            echo "A non-example environment file is tracked."
            exit 1
          fi

      - name: Check for obvious private-key files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(pem|key|p12|pfx)$'; then
            echo "Potential private-key material is tracked."
            exit 1
          fi
