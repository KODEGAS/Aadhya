name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Foundation file validation (pre-existing, kept intact)
  # ──────────────────────────────────────────────────────────────────────────
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/development/git-workflow.md
          test -f docs/development/development-guide.md
          test -f docs/development/coding-standards.md
          test -f docs/development/environment-strategy.md
          test -f docs/architecture/ADR/README.md

      - name: Check for tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\\.env$|(^|/)\\.env\\.(local|development|staging|production)$'; then
            echo "A non-example environment file is tracked."
            exit 1
          fi

      - name: Check for obvious private-key files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\\.(pem|key|p12|pfx)$'; then
            echo "Potential private-key material is tracked."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 2. YAML / Kubernetes manifest linting
  # ──────────────────────────────────────────────────────────────────────────
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml .

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Kubernetes manifest validation (kubeval / kubeconform)
  # ──────────────────────────────────────────────────────────────────────────
  k8s-manifest-validation:
    name: K8s manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate K8s manifests
        run: |
          find k8s/base -name '*.yaml' ! -name 'kustomization.yaml' | \
            xargs kubeconform -strict -summary

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize /usr/local/bin/

      - name: Render and validate dev overlay
        run: |
          kustomize build k8s/overlays/dev | \
            kubeconform -strict -summary

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Secret / credential leak detection
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Markdown lint (docs quality gate)
  # ──────────────────────────────────────────────────────────────────────────
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: ".markdownlint.yml"

  # ──────────────────────────────────────────────────────────────────────────
  # 6. K8s security policy check (checkov)
  # ──────────────────────────────────────────────────────────────────────────
  k8s-security-check:
    name: K8s security policy (checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checkov on K8s manifests
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          # Fail on HIGH and CRITICAL only at this stage; expand as manifests mature.
          soft_fail: false
          check: "CKV_K8S_8,CKV_K8S_9,CKV_K8S_10,CKV_K8S_11,CKV_K8S_14,CKV_K8S_16,CKV_K8S_20,CKV_K8S_28,CKV_K8S_30,CKV_K8S_36"

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Docker Compose config check
  # ──────────────────────────────────────────────────────────────────────────
  compose-config:
    name: Docker Compose config check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
